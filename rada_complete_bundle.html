<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADA - Where to go, what to wear, and who to go with</title>

  <!-- Tailwind CSS CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandTerracotta: '#E0533C',
            brandSage: '#2D6A4F',
            brandAmber: '#E9C46A',
            darkBg: '#121113',
            darkSurface: '#1C1A1E',
            lightBg: '#FFFFFF',
            lightSurface: '#F8F8F6'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13T[..." crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Leaflet CSS & JS for Interactive Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
    .spot-title { color: #E0533C !important; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .card-swipe-pass { transform: translateX(-120%) rotate(-15deg); opacity: 0; transition: all 0.3s ease-out; }
    .card-swipe-like { transform: translateX(120%) rotate(15deg); opacity: 0; transition: all 0.3s ease-out; }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(20px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(20px); }
    }
    .toast-notification {
      animation: fadeInOut 2.8s ease-in-out forwards;
    }
    #locationModalMap { height: 260px; width: 100%; border-radius: 1rem; z-index: 10; }
  </style>
</head>
<body class="bg-white text-slate-900 dark:bg-darkBg dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 antialiased selection:bg-brandTerracotta selection:text-white">

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2"></div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-darkBg/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-xs">
    <div class="max-w-lg mx-auto w-full px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <h1 onclick="switchTab('home')" class="text-2xl font-black tracking-tight text-brandTerracotta cursor-pointer hover:opacity-90 transition">RADA</h1>
        <span class="text-xs bg-lightSurface dark:bg-darkSurface text-slate-700 dark:text-slate-300 font-semibold px-2.5 py-1 rounded-full flex items-center gap-1.5 border border-slate-200 dark:border-slate-800">
          <i class="fa-solid fa-location-dot text-brandTerracotta text-[11px]"></i> <span>Westlands, Nairobi</span>
        </span>
      </div>
      
      <div class="flex items-center gap-1.5">
        <button onclick="toggleTheme()" id="themeToggleBtn" title="Toggle Light/Dark Theme" class="w-9 h-9 rounded-full bg-lightSurface dark:bg-darkSurface border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800">
          <i class="fa-regular fa-moon text-sm"></i>
        </button>
        <button onclick="openWagwanAI()" title="Wagwan AI Hangout Recommender" class="w-9 h-9 rounded-full bg-gradient-to-r from-brandTerracotta to-brandAmber text-white flex items-center justify-center shadow-sm">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="appRoot" class="flex-1 max-w-lg mx-auto w-full"></main>
</body>
</html>
